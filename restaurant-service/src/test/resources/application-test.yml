spring:
  config:
    import: file:../config-repo/application.yml,file:../config-repo/restaurant-service.yml
  cloud:
    config:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
  main:
    banner-mode: "off"
  jpa:
    open-in-view: false

eureka:
  client:
    enabled: false

logging:
  level:
    root: WARN
    com.example.restaurants: INFO
